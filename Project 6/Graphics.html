<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<title>Extreme Honeymoons - Graphics</title>


<style type="text/css">

#thumbs, #image
{
	width:700px;
	border: solid 1px #000;
	text-align:center;
	margin:0 auto 0 auto;
	color:#000;
	background:#eee;
	padding:5px;
}

#thumbs
{
	margin-top:10px;
}

#thumbs img
{
	border:solid 1px #000;
	margin:5px;
}

#image
{
	height:400px;
}

</style>



<script type="text/javascript">




var PrintButton1 = new Image();
var PrintButton2 = new Image();

var logo1 = new Image();
var logo2 = new Image();


if(document.images)
{

	PrintButton1.src = "images/print1.jpg";
	PrintButton2.src = "images/print2.jpg";

	logo1.src = "Images/Thumbnails/Business_logo2.png";
	logo2.src = "Images/Thumbnails/Business_logo2.png";

}



// Image Swap

var imgArray = new Array(

"Images/Thumbnails/CoupleBike3Lg.jpg",
"Images/Thumbnails/CoupleEvening3Lg.jpg",
"Images/Thumbnails/OwnerMotorcycle3Lg.jpg",
"Images/Thumbnails/CoupleScuba3Lg.jpg"

);



var titleArray = new Array(

"Couple on a Bike",
"Couple in the Evening",
"Owner on a Motorcycle",
"Couple Scuba Diving"

);



var imgPath = "images/fullsize/";



function swapImage(imgID)
{

	var theImage = document.getElementById("theImage");

	var textDiv = document.getElementById("bottomText");


	theImage.src = imgPath + imgArray[imgID];

	textDiv.innerHTML = titleArray[imgID];

}



function preloadImages()
{

	for(var i = 0; i < imgArray.length; i++)
	{

		var tempImage = new Image();

		tempImage.src = imgPath + imgArray[i];

	}

}


</script>


</head>



<body onload="preloadImages()">



<div align="center">



<!-- PRINT BUTTON ROLLOVER -->

<div>

<a href="#"
onmouseover="document.PrintButton.src=PrintButton2.src;"
onmouseout="document.PrintButton.src=PrintButton1.src;">


<img src="images/print1.jpg"
width="200"
height="50"
name="PrintButton"
alt="Print Page Button" />


</a>

</div>



<br>



<!-- LOGO ROLLOVER -->


<div>


<a href="#"
onmouseover="document.logo.src=logo2.src;"
onmouseout="document.logo.src=logo1.src;">


<img src="Images/Thumbnails/Business_logo2.png"
width="133"
height="126"
name="logo"
alt="Extreme Honeymoons Logo" />


</a>


</div>



<br>
<br>



<!-- IMAGE SWAP THUMBNAILS -->


<div id="thumbs">


<img src="images/thumbnails/Image1sm.jpg"
alt="Couple on a Bike"
onmouseover="swapImage(0);" />


<img src="images/thumbnails/Image2sm.jpg"
alt="Couple in the Evening"
onmouseover="swapImage(1);" />


<img src="images/thumbnails/Image3sm.jpg"
alt="Owner on Motorcycle"
onmouseover="swapImage(2);" />


<img src="images/thumbnails/Image4sm.jpg"
alt="Couple Scuba Diving"
onmouseover="swapImage(3);" />


</div>



<!-- LARGE IMAGE DISPLAY -->


<div id="image">


<img id="theImage"
src="images/fullsize/Image1Lg.jpg"
alt="Couple on a Bike"
width="400"
height="267" />


<h3 id="bottomText">
Couple on a Bike
</h3>


</div>




<img src="images/2colback.jpg"
alt="Two Column Background Image" />



</div>



</body>

</html>
